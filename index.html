                    { title: "1.1 Unity Hub安装与编辑器版本选择（含故障排除）", 
                      content: `✅ <strong>超详细步骤：</strong>
                      <br><br>1. **访问官网下载**：打开 <a class="external-link" href="https://unity.com/download" target="_blank">Unity官网</a>，下载Unity Hub 3.7+ 版本（支持Windows/macOS/Linux）。
                      <br>2. **安装Unity Hub**：双击安装程序，选择安装路径（建议非系统盘），完成安装。
                      <br>3. **登录与激活许可证**：
                      <br>   - 打开Unity Hub，使用Unity账号登录（如无账号，先免费注册）。
                      <br>   - 进入“许可证”菜单，点击“添加”，选择“获得免费的个人许可证”并激活。
                      <br>4. **安装指定编辑器版本**：
                      <br>   - 在“安装”选项卡点击“添加”按钮。

                      <br>5. **必须勾选的模块（非常重要！）**：

                      <br>     - SDK（Android软件开发工具包）

                      <br>6. **模块补装**：如果安装时漏装模块，后续可在Hub中“添加模块”随时补充。

                      <br>- 错误：安装卡在“正在下载”长时间不动 → 尝试切换网络或使用科学上网。
                      <br>- 错误：许可证激活失败 → 检查账号是否已验证邮箱，或重新登录。
                      <br>- 错误：模块下载失败 → 手动下载模块包，参考官方文档离线安装。
                      <br><br>🔗 <a class="external-link" href="https://docs.unity3d.com/Manual/GettingStartedInstallingHub.html" target="_blank">官方安装文档</a> | <a class="external-link" href="https://docs.unity3d.com/Manual/OfflineInstallation.html" target="_blank">离线安装指南</a>` },
                    
                    { title: "1.2 创建项目与Android环境深度验证", 
                      content: `📁 <strong>新建项目完整流程：</strong>
                      <br>1. 打开Unity Hub，点击“新建项目”，选择“3D核心”模板。
                      <br>2. 项目名称：例如“PICO_AR_Sports”，保存位置：**绝对不要包含中文或特殊字符**（建议英文路径）。
                      <br>3. 点击“创建项目”，等待Unity初始化完成。
                      <br><br>🔧 **Android环境深度验证**：
                      <br>1. 打开菜单 **Edit > Preferences > External Tools**（Windows）或 **Unity > Preferences**（macOS）。
                      <br>2. 检查 **Android SDK Tools** 路径是否自动识别：
                      <br>   - 默认路径：Windows为 <code>C:\\Users\\[用户名]\\AppData\\Local\\Android\\Sdk</code>
                      <br>   - 如果未识别，点击“Browse”手动指向SDK安装目录。
                      <br>3. 检查NDK、JDK、Gradle是否都已正确识别，如缺失可点击“Download”自动下载补全。
                      <br>4. **配置环境变量（高级）**：将Android SDK的platform-tools路径添加到系统PATH，方便使用adb命令。
                      <br><br>📱 **真机调试环境验证**：
                      <br>1. **开启PICO开发者模式**：
                      <br>   - 在PICO设备中进入“设置” > “通用” > “关于本机”，连续点击“版本号”7次开启开发者选项。
                      <br>   - 返回“设置” > “系统” > “开发者选项”，开启“USB调试”。
                      <br>2. **连接设备**：用USB线连接电脑，在PICO设备上弹出的“允许USB调试？”对话框中点击“允许”。
                      <br>3. **验证连接**：打开终端/命令提示符，输入 <code>adb devices</code>，如果显示设备序列号且状态为“device”，则表示连接成功。
                      <br>4. **Unity中配置Build**：

                      <br>     - **Package Name**：设置唯一包名，例如 <code>com.yourcompany.picoarsports</code>

                      <br>   - 点击“Build And Run”，如果能在PICO设备上安装一个空App（黑屏或显示默认场景），则环境验证成功。
                      <br><br>🔗 <a class="external-link" href="https://developer.android.com/studio/command-line/adb" target="_blank">ADB使用指南</a> | <a class="external-link" href="https://developer.picoxr.com/zh/document/unity/development-environment/" target="_blank">PICO开发环境文档</a>` },
                    
                    { title: "1.3 编辑器界面五视图精讲（AR开发视角）", 
                      content: `🖥️ **Unity五大核心视图详解（AR开发视角）**：
                      <br><br>1. **Scene视图**：
                      <br>   - **用途**：在AR开发中用于摆放虚拟物体、调整位置、设置光照。
                      <br>   - **快捷键**：Q（手形工具）、W（移动）、E（旋转）、R（缩放）。
                      <br>   - **技巧**：使用“2D”模式查看UI布局，使用“ISO”模式查看3D场景。
                      <br>   - **AR专用**：通过Scene视图可以精确地将虚拟物体放置在真实世界的对应位置（模拟）。
                      <br><br>2. **Game视图**：
                      <br>   - **用途**：预览最终输出效果，模拟不同分辨率和设备。
                      <br>   - **技巧**：点击“Free Aspect”可切换预设分辨率（如1080x1920模拟手机）。
                      <br>   - **AR专用**：在PICO头显中运行时，Game视图显示的是头显左眼画面。
                      <br><br>3. **Hierarchy视图**：
                      <br>   - **用途**：显示当前场景中所有游戏对象的层级结构，支持父子级关系。
                      <br>   - **技巧**：右键可快速创建基本对象（Cube、Camera、UI等）。
                      <br>   - **AR专用**：管理ImageTarget、PXR_CameraRig及其子物体（手柄、头显）。
                      <br><br>4. **Project视图**：
                      <br>   - **用途**：管理项目所有资源（脚本、模型、材质、场景等），支持搜索和筛选。
                      <br>   - **技巧**：使用“Packages”显示所有导入的包，使用“Favorites”快速访问常用资源。
                      <br>   - **AR专用**：按照规范组织资源，便于团队协作。
                      <br><br>5. **Inspector视图**：
                      <br>   - **用途**：查看和编辑选中物体的所有组件属性。
                      <br>   - **技巧**：点击右上角“锁”图标可以锁定当前物体，方便对比不同物体属性。
                      <br>   - **AR专用**：调整PXR_Manager的参数（如License、追踪设置）、修改手柄射线属性。
                      <br><br>🔧 **实用技巧**：
                      <br>- **布局保存**：调整好视图布局后，点击右上角“Layout”下拉菜单，选择“Save Layout...”保存自定义布局。
                      <br>- **搜索功能**：Hierarchy和Project视图都支持搜索，输入“t:script”可筛选所有脚本。
                      <br>- **快捷键**：按住Ctrl/Cmd + Shift + F可将摄像机对齐到Scene视图当前视角。` },
                    
                    { title: "1.4 游戏对象与组件架构实战（含完整示例）", 
                      content: `🧩 **组件式思维深度解析**：
                      <br>Unity的核心设计思想：**任何GameObject都是一个容器，通过添加组件赋予其功能**。组件包括Transform、MeshRenderer、Collider、脚本等。
                      <br><br>**实战演练：创建可交互的旋转立方体**：
                      <br>1. **创建空物体**：在Hierarchy右键 > “Create Empty”，命名为“Player”。
                      <br>2. **添加可视化组件**：
                      <br>   - 选中Player，点击Inspector下方的“Add Component”。
                      <br>   - 搜索并添加 **MeshFilter**，在Mesh属性中选择 **Cube**。
                      <br>   - 添加 **MeshRenderer**，在Materials中点击小圆圈选择默认材质（或新建材质）。
                      <br>3. **添加C#脚本**：
                      <br>   - 在Project视图的Scripts文件夹中右键 > “Create” > “C# Script”，命名为“Rotate”。
                      <br>   - 双击打开脚本，输入以下代码：
                      <div class="code-note">
                      using UnityEngine;<br>
                      public class Rotate : MonoBehaviour {<br>
                      &nbsp;   [Tooltip("旋转速度（度/秒）")]<br>
                      &nbsp;   public float speed = 30f;<br>
                      &nbsp;   void Update() {<br>
                      &nbsp;       // 绕Y轴匀速旋转，Time.deltaTime保证帧率独立<br>
                      &nbsp;       transform.Rotate(0, speed * Time.deltaTime, 0);<br>
                      &nbsp;   }<br>
                      }
                      </div>
                      <br>4. **挂载脚本**：将Rotate脚本拖拽到Player物体上，或点击“Add Component”搜索Rotate添加。
                      <br>5. **运行测试**：点击顶部播放按钮，应该看到立方体匀速旋转。
                      <br><br>**理解Tag和Layer**：
                      <br>- **Tag**：用于标识物体类型，例如“Player”、“Ball”。可在脚本中用 <code>CompareTag("Player")</code> 快速判断。
                      <br>- **Layer**：用于物理碰撞筛选、相机渲染分层。例如设置“Player”层只与“Ball”层碰撞。
                      <br><br>**组件生命周期**：
                      <br>- **Awake()**：物体创建时调用，用于初始化。
                      <br>- **Start()**：第一帧更新前调用。
                      <br>- **Update()**：每帧调用，用于处理逻辑。
                      <br>- **FixedUpdate()**：固定时间步长调用，用于物理计算。

                      <br><code>PXR_Manager.Instance.GetHeadPose()</code> 返回头显的Transform，包含位置和旋转。
                      <br><br>**手柄追踪API详解**：
                      <br>- <code>PXR_Input.GetControllerPosition(int hand)</code>：获取手柄位置（0=左手，1=右手）
                      <br>- <code>PXR_Input.GetControllerRotation(int hand)</code>：获取手柄旋转
                      <br>- <code>PXR_Input.GetControllerVelocity(int hand)</code>：获取手柄速度
                      <br>- <code>PXR_Input.GetControllerAngularVelocity(int hand)</code>：获取手柄角速度
                      <br><br>**坐标系说明**：
                      <br>PICO使用右手坐标系，Y轴向上，单位是米。原点为头显启动时的位置。
                      <br><br>**代码示例：实时追踪所有设备**：
                      <div class="code-note">
                      using UnityEngine;<br>
                      using PXR_Input;<br>
                      public class TrackingDemo : MonoBehaviour {<br>

                      <br>
                      &nbsp;       // 左手柄<br>
                      &nbsp;       Vector3 leftPos = PXR_Input.GetControllerPosition(0);<br>
                      &nbsp;       Quaternion leftRot = PXR_Input.GetControllerRotation(0);<br>
                      &nbsp;       Debug.Log($"左手柄位置: {leftPos}");<br>
                      <br>
                      &nbsp;       // 右手柄<br>
                      &nbsp;       Vector3 rightPos = PXR_Input.GetControllerPosition(1);<br>
                      &nbsp;       Quaternion rightRot = PXR_Input.GetControllerRotation(1);<br>
                      &nbsp;       Debug.Log($"右手柄位置: {rightPos}");<br>
                      &nbsp;   }<br>
                      }
                      </div>` },

                      <div class="code-note">
                      using PXR_SpatialAnchor;<br>
                      public void CreateAnchor(Vector3 pos, Quaternion rot) {<br>
                      &nbsp;   PXR_SpatialAnchor.CreateAnchor(pos, rot, (anchor, result) => {<br>
                      &nbsp;       switch (result) {<br>
                      &nbsp;           case AnchorResult.Success:<br>
                      &nbsp;               Debug.Log($"锚点创建成功，UUID: {anchor.UUID}");<br>
                      &nbsp;               // 创建成功后立即保存<br>
                      &nbsp;               SaveAnchor(anchor);<br>
                      &nbsp;               break;<br>
                      &nbsp;           case AnchorResult.FailedTracking:<br>
                      &nbsp;               Debug.LogError("创建失败：追踪丢失");<br>
                      &nbsp;               break;<br>
                      &nbsp;           case AnchorResult.FailedInvalidArgument:<br>
                      &nbsp;               Debug.LogError("创建失败：参数无效");<br>
                      &nbsp;               break;<br>
                      &nbsp;           default:<br>
                      &nbsp;               Debug.LogError($"创建失败：未知错误 {result}");<br>

                      &nbsp;       }<br>
                      &nbsp;   });<br>
                      }
                      </div>
                      <br>**保存锚点（持久化到设备）**：

                      content: `💥 **球体物理设置详解**：
                      <br><br>**Rigidbody组件设置**：
                      <br>- **Mass（质量）**：网球建议0.05-0.1，乒乓球0.02-0.03
                      <br>- **Drag（阻力）**：0.1-0.5，影响球速衰减
                      <br>- **Angular Drag（角阻力）**：0.1-0.3
                      <br>- **Use Gravity**：勾选（使用重力）
                      <br>- **Is Kinematic**：不勾选
                      <br>- **Interpolate**：建议设为Interpolate，使运动更平滑
                      <br><br>**Physic Material（物理材质）**：
                      <div class="code-note">
                      // 创建网球物理材质<br>
                      PhysicMaterial tennisMat = new PhysicMaterial();<br>
                      tennisMat.bounciness = 0.8f;      // 弹力系数<br>
                      tennisMat.bounceCombine = PhysicMaterialCombine.Maximum; // 取最大弹力<br>
                      tennisMat.dynamicFriction = 0.3f;  // 动摩擦<br>
                      tennisMat.staticFriction = 0.3f;   // 静摩擦<br>
                      tennisMat.frictionCombine = PhysicMaterialCombine.Average; // 摩擦取平均
                      </div>
                      <br>**击球算法（基于手柄速度）**：
                      <div class="code-note">
                      public class RacketController : MonoBehaviour {<br>
                      &nbsp;   public float hitForce = 15f;           // 基础击球力度<br>
                      &nbsp;   public float velocityMultiplier = 0.5f; // 速度乘数<br>
                      &nbsp;   public int handIndex = 1;               // 右手柄<br>
                      <br>
                      &nbsp;   void OnCollisionEnter(Collision collision) {<br>
                      &nbsp;       if (collision.gameObject.CompareTag("Ball")) {<br>
                      &nbsp;           Rigidbody ballRb = collision.rigidbody;<br>
                      &nbsp;           <br>
                      &nbsp;           // 获取手柄速度<br>
                      &nbsp;           Vector3 racketVelocity = InputManager.Instance.GetControllerVelocity(handIndex);<br>
                      &nbsp;           <br>
                      &nbsp;           // 计算击球方向：拍面法线 + 手柄速度方向<br>
                      &nbsp;           Vector3 normal = collision.contacts[0].normal;<br>
                      &nbsp;           Vector3 direction = (normal * 0.7f + racketVelocity.normalized * 0.3f).normalized;<br>
                      &nbsp;           <br>
                      &nbsp;           // 计算最终速度：基础方向 * 力度 + 手柄速度 * 乘数<br>
                      &nbsp;           ballRb.velocity = direction * hitForce + racketVelocity * velocityMultiplier;<br>
                      &nbsp;           <br>
                      &nbsp;           // 触发震动反馈<br>
                      &nbsp;           InputManager.Instance.SetVibration(handIndex, 0.8f, 100);<br>
                      &nbsp;       }<br>
                      &nbsp;   }<br>
                      }
                      </div>` },
                    
                    { title: "5.3 碰撞检测与伤害计算（接口设计模式）", 
                      content: `⚔️ **IDamageable接口设计**：
                      <div class="code-note">
                      public interface IDamageable {<br>
                      &nbsp;   void TakeDamage(int damage, Vector3 hitPoint, GameObject source);<br>
                      &nbsp;   bool IsAlive { get; }<br>
                      &nbsp;   int CurrentHealth { get; }<br>
                      &nbsp;   int MaxHealth { get; }<br>

                      </div>
                      <br>**玩家健康实现**：
                      <div class="code-note">
                      public class PlayerHealth : MonoBehaviour, IDamageable {<br>
                      &nbsp;   [SerializeField] private int maxHealth = 100;<br>
                      &nbsp;   private int currentHealth;<br>
                      &nbsp;   public event System.Action<int, int> OnHealthChanged; // 血量变化事件<br>
                      &nbsp;   public event System.Action OnPlayerDied;              // 死亡事件<br>
                      <br>
                      &nbsp;   public int CurrentHealth => currentHealth;<br>
                      &nbsp;   public int MaxHealth => maxHealth;<br>
                      &nbsp;   public bool IsAlive => currentHealth > 0;<br>
                      <br>
                      &nbsp;   void Start() {<br>
                      &nbsp;       currentHealth = maxHealth;<br>
                      &nbsp;   }<br>
                      <br>
                      &nbsp;   public void TakeDamage(int damage, Vector3 hitPoint, GameObject source) {<br>
                      &nbsp;       if (!IsAlive) return;<br>
                      &nbsp;       <br>
                      &nbsp;       currentHealth = Mathf.Max(0, currentHealth - damage);<br>
                      &nbsp;       OnHealthChanged?.Invoke(currentHealth, maxHealth);<br>
                      &nbsp;       <br>
                      &nbsp;       // 播放受击特效<br>
                      &nbsp;       PlayHitEffect(hitPoint);<br>
                      &nbsp;       <br>
                      &nbsp;       // 触发震动反馈<br>

                      &nbsp;       // 播放死亡动画、禁用控制等<br>

                      <br>**能量球脚本（攻击者）**：

                      public class EnergyBall : MonoBehaviour {<br>

                    { title: "5.4 对象池（Object Pool）深度优化", 
                      content: `🧺 **为什么需要对象池？**
                      <br>避免频繁 Instantiate/Destroy 导致的GC和卡顿。在快速球类游戏中，每秒可能生成数十个球，对象池是必备优化。
                      <br><br>**完整对象池实现**：
                      <div class="code-note">
                      public class ObjectPool : MonoBehaviour {<br>
                      &nbsp;   public static ObjectPool Instance { get; private set; }<br>
                      &nbsp;   <br>
                      &nbsp;   public GameObject ballPrefab;<br>
                      &nbsp;   public int poolSize = 30;<br>
                      &nbsp;   private Queue<GameObject> pool = new Queue<GameObject>();<br>
                      &nbsp;   private List<GameObject> activeBalls = new List<GameObject>();<br>
                      <br>
                      &nbsp;   void Awake() {<br>
                      &nbsp;       Instance = this;<br>
                      &nbsp;       // 预创建对象池<br>
                      &nbsp;       for (int i = 0; i < poolSize; i++) {<br>
                      &nbsp;           GameObject ball = Instantiate(ballPrefab);<br>
                      &nbsp;           ball.SetActive(false);<br>
                      &nbsp;           pool.Enqueue(ball);<br>
                      &nbsp;       }<br>
                      &nbsp;   }<br>
                      <br>
                      &nbsp;   public GameObject GetBall() {<br>
                      &nbsp;       GameObject ball;<br>
                      &nbsp;       if (pool.Count > 0) {<br>
                      &nbsp;           ball = pool.Dequeue();<br>
                      &nbsp;       } else {<br>
                      &nbsp;           // 如果池子空了，动态扩容<br>
                      &nbsp;           ball = Instantiate(ballPrefab);<br>
                      &nbsp;           Debug.LogWarning("对象池扩容，建议增加初始池大小");<br>
                      &nbsp;       }<br>
                      &nbsp;       <br>
                      &nbsp;       ball.SetActive(true);<br>
                      &nbsp;       activeBalls.Add(ball);<br>
                      &nbsp;       return ball;<br>
                      &nbsp;   }<br>
                      <br>
                      &nbsp;   public void ReturnBall(GameObject ball) {<br>
                      &nbsp;       if (!activeBalls.Contains(ball)) return;<br>
                      &nbsp;       <br>
                      &nbsp;       ball.SetActive(false);<br>
                      &nbsp;       // 重置物理状态<br>
                      &nbsp;       Rigidbody rb = ball.GetComponent<Rigidbody>();<br>
                      &nbsp;       rb.velocity = Vector3.zero;<br>
                      &nbsp;       rb.angularVelocity = Vector3.zero;<br>
                      &nbsp;       <br>
                      &nbsp;       activeBalls.Remove(ball);<br>
                      &nbsp;       pool.Enqueue(ball);<br>
                      &nbsp;   }<br>
                      <br>
                      &nbsp;   public void ReturnAllBalls() {<br>
                      &nbsp;       foreach (var ball in activeBalls.ToArray()) {<br>
                      &nbsp;           ReturnBall(ball);<br>
                      &nbsp;       }<br>
                      &nbsp;   }<br>
                      }
                      </div>` },

                      public class LookAtCamera : MonoBehaviour {<br>
                      &nbsp;   private Camera mainCamera;<br>

                      &nbsp;   void Start() {<br>

                      &nbsp;   void UpdateHealthBar(int current, int max) {<br>

                description: "Stakeholder meetings are key to making sure a project goes well. They make sure that team members and stakeholders are on the same page. This chapter's got everything: agendas, clear roles, adaptive communication, meeting notes, action items, and lessons learned.",
                sections: [
                    { 
                        title: "7.0 Overview and Key Steps", 
                        content: `
                        <div class="chapter-content-block">
                        Stakeholder meetings are key to making sure a project goes well. They make sure that team members and stakeholders are on the same page. These meetings help the team really understand the whole project. But, you know, getting stakeholder meetings to be effective takes some planning and clear roles. The last thing a team wants is to come off as unprofessional, because that could damage trust and make stakeholders reluctant to keep working together.
                        </div>
                        <h3 class="section-title" style="font-size:1.5rem; margin-top:2rem;">Key Steps for Successful Stakeholder Meetings</h3>
                        <div class="chapter-content-block">
                        <h4>1. Structured Agenda</h4>
                        <p>It's key to have a solid agenda to keep meetings on track and productive. It should outline the main points to be discussed. We've found that point forms usually do the trick, but it's also good to include extra notes or sub-points for important details. This makes sure we don't miss anything important and gives us a reference in case we forget anything during the discussion.</p>
                        
                        <h4>2. Clear Roles and Responsibilities</h4>
                        <p>Assigning specific roles for each meeting helps streamline discussions and ensures accountability. In our project, we adopted the following roles:</p>
                        <ul>
                            <li><strong>Chair:</strong> Guides the meeting, keeps discussions on track, and ensures the agenda is followed. The chair is the main person driving the conversation and presenting updates.</li>
                            <li><strong>Secretary:</strong> Documents meeting minutes, record whatever important points that were discussed in the meeting.</li>
                        </ul>
                        
                        <h4>3. Adaptive Communication and Smart Engagement</h4>
                        <p>Good communication is key to stakeholder meetings. Instead of being stuck to the agenda, it's important to go with the flow of the conversation. If we've already gone over certain points in a previous conversation, it's probably best to avoid repeating them. Otherwise, we might end up frustrating the stakeholders. Also, if you ask the same questions over and over, it might make your team look unprepared and disorganized.</p>
                        <p>To improve communication, we recommend:</p>
                        <ul>
                            <li><strong>Reading the room:</strong> Pay attention to stakeholders' engagement levels and adapt accordingly.</li>
                            <li><strong>Avoiding excessive repetition:</strong> Be mindful of what has already been discussed and prevent redundancy.</li>
                        </ul>
                        
                        <h4>4. Meeting Minutes</h4>
                        <p>It's really important to record meeting minutes when you're working with stakeholders. A detailed record of discussions makes sure that key points aren't forgotten and provides a clear reference for future actions. Meeting minutes also help team members who couldn't make it stay informed about what was discussed.</p>
                        <p>Also, keeping detailed records helps you keep track of everything and makes sure you don't miss anything. By reviewing the minutes, the team can make sure that all the points that were discussed have been dealt with and that any necessary follow-ups have been completed.</p>
                        <p>We take notes during our meetings in point form to keep things clear and efficient. To help you out, we've added brackets with extra info or reasons for each point we've recorded. This approach makes sure that every note is meaningful and actionable.</p>
                        
                        <h4>5. Action Items and Follow-Ups</h4>
                        <p>At the end of each meeting, we have an internal team discussion to brief the other group members on what was discussed and outline the actions to be taken moving forward. This makes sure everyone's on the same page and knows what to do next.</p>
                                                 
                        <h4>What We Learned:</h4>
                        <ul>
                            <li><strong>Consistency Builds Trust:</strong> Keeping the same people in key roles ensures that stakeholders have a consistent point of contact, fostering stronger relationships over time.</li>
                            <li><strong>Role Familiarity Enhances Performance:</strong> When individuals perform the same role repeatedly, they become more skilled and efficient, leading to smoother meetings and better outcomes.</li>
                            <li><strong>Balance Learning and Stakeholder Needs:</strong> While it's important to provide team members with growth opportunities, this should be balanced with the need for stakeholder confidence and meeting effectiveness.</li>
                        </ul>
                        
                        <h3>Best Practices for Future Projects</h3>
                        <p>Based on our experience, here are some recommendations for organizing stakeholder meetings:</p>
                        <ul>
                            <li><strong>Assign Fixed Roles:</strong> Identify a consistent chair and secretary for the duration of the project. This ensures continuity and builds stakeholder confidence.</li>
                            <li><strong>Rotate Roles Strategically:</strong> If team members need exposure to different roles, consider rotating responsibilities during internal team meetings rather than stakeholder meetings.</li>
                            <li><strong>Prepare Agendas:</strong> Clearly communicate the purpose, structure, and roles of the meeting to stakeholders in advance to set expectations.</li>
                            <li><strong>Document and Share Minutes:</strong> Ensure meeting minutes and action items are shared promptly after each meeting to keep everyone informed and aligned.</li>
                        </ul>

            // ----- 双栏渲染逻辑 -----
            let activeChapterId = 4;

            function renderChapterList() {
                const container = document.getElementById('chapterListContainer');
                let html = '';
                tutorialData.chapters.forEach(ch => {
                    const activeClass = (activeChapterId === ch.id) ? 'active' : '';
                    html += `<div class="chapter-item ${activeClass}" data-chapter-id="${ch.id}">
                        <div class="chapter-idx">第${ch.id}章</div>
                        <div class="chapter-title">${ch.title}</div>
                        <div class="chapter-desc">${ch.description.substring(0,70)}…</div>
                    </div>`;
                });
                container.innerHTML = html;

                document.querySelectorAll('.chapter-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = parseInt(item.dataset.chapterId);
                        showChapter(id);
                    });
                });
            }

            function showChapter(id) {
                const chapter = tutorialData.chapters.find(c => c.id === id);
                if (!chapter) return;
                activeChapterId = id;
                document.querySelectorAll('.chapter-item').forEach(el => {
                    el.classList.toggle('active', parseInt(el.dataset.chapterId) === id);
                });

                let sectionsHtml = '';
                chapter.sections.forEach(sec => {
                    sectionsHtml += `<div class="section-block">
                        <div class="section-title"><span class="sec-badge">${sec.title.split(' ')[0]}</span> ${sec.title.replace(/^[0-9.]+/, '')}</div>
                        <div class="section-content">${sec.content}</div>
                    </div>`;
                });

                const prevDisabled = chapter.id <= 1 ? 'style="opacity:0.4; pointer-events:none;"' : '';
                const nextDisabled = chapter.id >= tutorialData.chapters.length ? 'style="opacity:0.4; pointer-events:none;"' : '';

                const detailHtml = `
                    <div class="detail-header">
                        <h2>第${chapter.id}章 · ${chapter.title}</h2>
                        <div class="desc">${chapter.description}</div>
                    </div>
                    ${sectionsHtml}
                    <div class="nav-buttons">
                        <button class="nav-btn" ${prevDisabled} onclick="window.prevChapter(${chapter.id})">← 上一章</button>
                        <button class="nav-btn" ${nextDisabled} onclick="window.nextChapter(${chapter.id})">下一章 →</button>
                    </div>
                    <div class="footer-note">© 深度扩展教程 · 最终修订版</div>
                `;
                document.getElementById('detailContentArea').innerHTML = detailHtml;
            }

            window.prevChapter = (curr) => { if (curr > 1) showChapter(curr - 1); };
            window.nextChapter = (curr) => { if (curr < tutorialData.chapters.length) showChapter(curr + 1); };

            renderChapterList();
            showChapter(4);
        })();
    </script>
