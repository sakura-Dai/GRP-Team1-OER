                      content: `🧺 Why Object Pool?
                      <br>Avoid GC and stuttering caused by frequent Instantiate/Destroy. In fast-paced ball games, dozens of balls may be generated per second; object pooling is essential.
                      <br><br>Complete Object Pool Implementation:
                      <div class="code-note">
                      public class ObjectPool : MonoBehaviour {<br>
                      &nbsp;   public static ObjectPool Instance { get; private set; }<br>
                      &nbsp;   <br>
                      &nbsp;   public GameObject ballPrefab;<br>
                      &nbsp;   public int poolSize = 30;<br>
                      &nbsp;   private Queue<GameObject> pool = new Queue<GameObject>();<br>
                      &nbsp;   private List<GameObject> activeBalls = new List<GameObject>();<br>
                      <br>
                      &nbsp;   void Awake() {<br>
                      &nbsp;       Instance = this;<br>
                      &nbsp;       for (int i = 0; i < poolSize; i++) {<br>
                      &nbsp;           GameObject ball = Instantiate(ballPrefab);<br>
                      &nbsp;           ball.SetActive(false);<br>
                      &nbsp;           pool.Enqueue(ball);<br>
                      &nbsp;       }<br>
                      &nbsp;   }<br>
                      <br>
                      &nbsp;   public GameObject GetBall() {<br>
                      &nbsp;       GameObject ball;<br>
                      &nbsp;       if (pool.Count > 0) {<br>
                      &nbsp;           ball = pool.Dequeue();<br>
                      &nbsp;       } else {<br>
                      &nbsp;           ball = Instantiate(ballPrefab);<br>
                      &nbsp;           Debug.LogWarning("Object pool expanded, consider increasing initial pool size");<br>
                      &nbsp;       }<br>
                      &nbsp;       ball.SetActive(true);<br>
                      &nbsp;       activeBalls.Add(ball);<br>
                      &nbsp;       return ball;<br>
                      &nbsp;   }<br>
                      <br>
                      &nbsp;   public void ReturnBall(GameObject ball) {<br>
                      &nbsp;       if (!activeBalls.Contains(ball)) return;<br>
                      &nbsp;       ball.SetActive(false);<br>
                      &nbsp;       Rigidbody rb = ball.GetComponent<Rigidbody>();<br>
                      &nbsp;       rb.velocity = Vector3.zero;<br>
                      &nbsp;       rb.angularVelocity = Vector3.zero;<br>
                      &nbsp;       activeBalls.Remove(ball);<br>
                      &nbsp;       pool.Enqueue(ball);<br>
                      &nbsp;   }<br>
                      <br>
                      &nbsp;   public void ReturnAllBalls() {<br>
                      &nbsp;       foreach (var ball in activeBalls.ToArray()) {<br>
                      &nbsp;           ReturnBall(ball);<br>
                      &nbsp;       }<br>
                      &nbsp;   }<br>
                      }

                        title: "7.0 Overview and Key Steps", 
                        content: `
                        <div class="chapter-content-block">
                        Stakeholder meetings are key to ensuring a project goes well. They ensure that team members and stakeholders are aligned. These meetings help the team truly understand the whole project. However, organizing effective stakeholder meetings requires planning and clear roles. The last thing a team wants is to come across as unprofessional, as that could damage trust and make stakeholders reluctant to continue collaboration.
                        </div>
                        <h3 class="section-title" style="font-size:1.5rem; margin-top:2rem;">Key Steps for Successful Stakeholder Meetings</h3>
                        <div class="chapter-content-block">
                        <h4>1. Structured Agenda</h4>
                        <p>A well-prepared agenda is essential for keeping meetings focused and productive. It should outline the key discussion points. Based on our experience, point forms are usually sufficient, but including additional notes or sub-points for important details is also helpful. This ensures critical topics are not overlooked and provides a reference in case any points are forgotten during discussion.</p>
                        
                        <h4>2. Clear Roles and Responsibilities</h4>
                        <p>Assigning specific roles for each meeting helps streamline discussions and ensures accountability. In our project, we adopted the following roles:</p>
                        <ul>
                            <li><strong>Chair:</strong> Guides the meeting, keeps discussions on track, and ensures the agenda is followed. The chair is the main person driving the conversation and presenting updates.</li>
                            <li><strong>Secretary:</strong> Documents meeting minutes, recording important points discussed.</li>
                        </ul>
                        
                        <h4>3. Adaptive Communication and Smart Engagement</h4>
                        <p>Effective communication is key to stakeholder meetings. Instead of rigidly following the agenda, it's important to follow the natural flow of conversation. If certain points have already been addressed in previous conversations, repeating them unnecessarily can frustrate stakeholders. Likewise, asking the same questions multiple times can make the team appear unprepared and disorganized.</p>
                        <p>To improve communication, we recommend:</p>
                        <ul>
                            <li><strong>Reading the room:</strong> Pay attention to stakeholders' engagement levels and adapt accordingly.</li>
                            <li><strong>Avoiding excessive repetition:</strong> Be mindful of what has already been discussed and prevent redundancy.</li>
                        </ul>
                        
                        <h4>4. Meeting Minutes</h4>
                        <p>Recording meeting minutes is a crucial part of successful stakeholder engagement. A well-documented record of discussions ensures key points are not forgotten and provides a clear reference for future actions. Meeting minutes also help team members who couldn't attend stay informed.</p>
                        <p>Additionally, keeping detailed records prevents minor details from being overlooked and serves as a checklist for tracking progress. By reviewing the minutes, the team can ensure all discussed points have been addressed and necessary follow-ups are completed.</p>
                        <p>In our meetings, minutes are recorded in point form for clarity and efficiency. To enhance understanding, we include brackets to provide additional explanations or justifications for each recorded point. This approach ensures every note remains meaningful and actionable.</p>
                        
                        <h4>5. Action Items and Follow-Ups</h4>
                        <p>At the end of each stakeholder meeting, we hold an internal team discussion to brief other group members on what was discussed and outline actions to be taken moving forward. This ensures everyone is informed and aligned with next steps.</p>
                                                 
                        <h4>What We Learned:</h4>
                        <ul>
                            <li><strong>Consistency Builds Trust:</strong> Keeping the same people in key roles ensures stakeholders have a consistent point of contact, fostering stronger relationships over time.</li>
                            <li><strong>Role Familiarity Enhances Performance:</strong> When individuals perform the same role repeatedly, they become more skilled and efficient, leading to smoother meetings and better outcomes.</li>
                            <li><strong>Balance Learning and Stakeholder Needs:</strong> While it's important to provide team members with growth opportunities, this should be balanced with the need for stakeholder confidence and meeting effectiveness.</li>
                        </ul>
                        
                        <h3>Best Practices for Future Projects</h3>
                        <p>Based on our experience, here are some recommendations for organizing stakeholder meetings:</p>
                        <ul>
                            <li><strong>Assign Fixed Roles:</strong> Identify a consistent chair and secretary for the duration of the project. This ensures continuity and builds stakeholder confidence.</li>
                            <li><strong>Rotate Roles Strategically:</strong> If team members need exposure to different roles, consider rotating responsibilities during internal team meetings rather than stakeholder meetings.</li>
                            <li><strong>Prepare Agendas:</strong> Clearly communicate the purpose, structure, and roles of the meeting to stakeholders in advance to set expectations.</li>
                            <li><strong>Document and Share Minutes:</strong> Ensure meeting minutes and action items are shared promptly after each meeting to keep everyone informed and aligned.</li>
                        </ul>
                        </div>
                        ` }

            // Render left sidebar
            function renderChapterList() {
                const container = document.getElementById('chapterListContainer');
                let html = '';
                allItems.forEach((item, idx) => {
                    const isIntro = (idx === 0);
                    const activeClass = (activeItemId === (isIntro ? 0 : item.id)) ? 'active' : '';
                    const idxDisplay = isIntro ? '' : `<div class="chapter-idx">Chapter ${item.id}</div>`;
                    html += `<div class="chapter-item ${activeClass}" data-item-id="${isIntro ? 0 : item.id}" data-is-intro="${isIntro}">
                        ${idxDisplay}
                        <div class="chapter-title">${item.title}</div>
                        <div class="chapter-desc">${item.description.substring(0,70)}…</div>
                    </div>`;
                });
                container.innerHTML = html;

                document.querySelectorAll('.chapter-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = parseInt(item.dataset.itemId);
                        const isIntro = item.dataset.isIntro === 'true';
                        showContent(isIntro ? 0 : id);
                    });
                });
            }

            let activeItemId = 0; // Default to introduction page

            function showContent(id) {
                let content;
                let title;
                let description;
                
                if (id === 0) {
                    content = introContent;
                    title = introContent.title;
                    description = introContent.description;
                    activeItemId = 0;
                } else {
                    const chapter = tutorialData.chapters.find(c => c.id === id);
                    if (!chapter) return;
                    content = chapter;
                    title = `Chapter ${chapter.id}: ${chapter.title}`;
                    description = chapter.description;
                    activeItemId = id;
                }

                // Update left sidebar highlighting
                document.querySelectorAll('.chapter-item').forEach(el => {
                    const itemId = parseInt(el.dataset.itemId);
                    const isIntro = el.dataset.isIntro === 'true';
                    if ((isIntro && id === 0) || (!isIntro && itemId === id)) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });

                // Generate right content
                let sectionsHtml = '';
                if (content.sections) {
                    content.sections.forEach(sec => {
                        sectionsHtml += `<div class="section-block">
